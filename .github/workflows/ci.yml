name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      SUPABASE_BUCKET_NAME: storinary
      NEXT_PUBLIC_MAX_FILE_SIZE_MB: "10"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Intentionally scoped to the Image model (the only model) — extend the
      # sed range / add new blocks if more models are added to the schemas.
      - name: Validate Postgres schema + model parity
        run: |
          DATABASE_URL="postgresql://user:pass@localhost:5432/storinary" npx prisma validate --schema prisma/postgres/schema.prisma
          diff <(sed -n '/^model Image/,/^}/p' prisma/schema.prisma) <(sed -n '/^model Image/,/^}/p' prisma/postgres/schema.prisma)

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
